<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>토이 1호: 첫 웹페이지</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<section>
  <h1>나의 첫 웹페이지</h1>
  <p>웹 개발을 시작했습니다!</p>
  <!-- <b> : 진한 글자 bold -->
  <p>오늘은 <b>좋은 날</b>입니다.</p>
 </section>
 <section>
   <h2>오늘 할 일</h2>
   <!-- 리스트 만들기 -->
   <ul> <!--  리스트 -->
     <li>책읽기</li> <!-- 목록 -->
     <li>산책하기</li>
     <li>분리수거하기</li>
     <li>설거지하기</li>
     <li>물건산거 정리하기</li>
     <li>방 환기시키기</li>
     <li>요리해둔거 챙겨먹기</li>
   </ul>
   <input name="전송" type="button">
   <button id="check"type="button">확인</button>
   <button id="reset"type="reset">초기화</button>
 </section>
 <section>
   <!-- 입력창과 버튼만들기 -->
   <label for="nickname">별명</label>
   <!-- for:밑에 input의 id="nickname"과 한팀을 이룬다  -->
   <input 
     id="nickname" 
     type="text" 
     placeholder="별명을 입력하세요">
   <button id="submit"type="submit">입력</button>
   <br>
   <label for="name">이름</label>
   <input id="name" type="text" placeholder="이름을 입력하세요">
   <button id="hellobutton">환영합니다.</button>
 </section>
 <!--  <section> 대신에 <div>사용 -->
 <div class="card">
  <h2>🌹🌹오늘의 목표🌹🌹</h2>
  <p>오늘도 열심히 공부하기</p>
  <div>
  	<input type="text" id="taskInput" placeholder="할일을 입력하세요">
  	<button id="addButton" >추가하기</button>
  	<!-- 입력상자에서 입력한 할일 추가 -->
    <ul id="taskList"></ul>
  </div>
  <hr>
  <h2>🎁 나의 행운 상자</h2>
  <div id="result"><p>행운을 뽑아봅시다.</p></div>
  <button onclick="drawFortune()">행운 뽑기</button>
  <button onclick="saveFortune()">행운 저장</button>
  <button onclick="loadFortune()">저장된 행운 불러오기</button>
  <button onclick="deleteFortune()">저장 삭제</button>
 </div>
 
 <!-- 객체와 배열 -->
 <div class="card">
   <button id="button1">첫번째 배열 요소값 출력</button>
   <button id="button2">두번째 배열 요소값 출력</button>
   <button id="button3">세번째 배열 요소값 출력</button>
 </div>

</html>
